[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"   # Arc targets Osaka (a superset); see docs.arc.io/arc/references/evm-differences
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

# Network URLs come from the environment (.env), never hardcoded here.
# Official values: https://docs.arc.io/arc/references/connect-to-arc
[rpc_endpoints]
arc_mainnet = "${ARC_MAINNET_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"
